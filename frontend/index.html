<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trinethra Feedback Analyzer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>Trinethra Feedback Analyzer</h1>

    <textarea id="transcript" placeholder="Paste supervisor transcript here..."></textarea>

    <button id="analyzeBtn">Run Analysis</button>

    <div class="output">

      <div class="card">
        <h2>Evidence</h2>
        <p id="evidence">No analysis yet</p>
      </div>

      <div class="card">
        <h2>Rubric Score</h2>
        <p id="score">No analysis yet</p>
      </div>

      <div class="card">
        <h2>KPI Mapping</h2>
        <p id="kpi">No analysis yet</p>
      </div>

      <div class="card">
        <h2>Gap Analysis</h2>
        <p id="gaps">No analysis yet</p>
      </div>

      <div class="card">
        <h2>Follow-up Questions</h2>
        <p id="questions">No analysis yet</p>
      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
